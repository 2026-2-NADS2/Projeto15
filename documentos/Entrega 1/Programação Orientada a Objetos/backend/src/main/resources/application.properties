spring.application.name=kfka
server.port=${PORT:8080}
spring.profiles.default=dev
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jackson.deserialization.fail-on-unknown-properties=true
server.error.include-stacktrace=never
server.error.include-message=never
kfka.jwt.secret=${JWT_SECRET}
kfka.jwt.expiracao-minutos=${JWT_EXPIRACAO_MINUTOS:120}
kfka.cors.origens=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
kfka.media.minima=${MEDIA_MINIMA:0}
kfka.media.maxima=${MEDIA_MAXIMA:10}
kfka.fuso-horario=${FUSO_HORARIO:America/Sao_Paulo}
kfka.admin.email=${ADMIN_EMAIL:}
kfka.admin.senha=${ADMIN_PASSWORD:}
spring.data.web.pageable.max-page-size=100
kfka.recuperacao.expor-codigo=${RECUPERACAO_EXPOR_CODIGO:false}
